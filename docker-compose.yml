version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
    networks:
      - task-net

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
    networks:
      - task-net

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    networks:
      - task-net

networks:
  task-net:
    driver: bridge
