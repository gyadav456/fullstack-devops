apiVersion: v1
kind: ConfigMap
metadata:
  name: task-manager-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  task-manager.json: |
    {
      "title": "Task Manager App",
      "panels": [
        {
          "title": "Requests per Second",
          "type": "graph",
          "targets": [
            { "expr": "rate(flask_http_request_total[1m])" }
          ]
        },
        {
          "title": "Error Rate",
          "type": "graph",
          "targets": [
            { "expr": "rate(flask_http_request_total{status=~'5..'}[1m])" }
          ]
        }
      ]
    }
